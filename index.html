<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내부 품질 기한</title>

<style>
* {
  box-sizing: border-box; /* 💡 핵심 */
}

body {
  margin:0;
  font-family:sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
}

/* 전체 폭 제한 (웹 대응) */
.app {
  width:100%;
  max-width:480px;
  background:#f4f6f8;
  min-height:100vh;
}

header {
  background:#006241;
  color:white;
  padding:14px;
  text-align:center;
  font-weight:bold;
}

/* 탭 */
.tabs {
  display:flex;
  background:white;
}
.tab {
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
  color:#777;
}
.tab.active {
  color:#006241;
  font-weight:bold;
  border-bottom:2px solid #006241;
}

/* 검색 */
.search {
  padding:10px;
  background:white;
}
.search input {
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* 리스트 */
.container {
  padding:10px;
}

.card {
  background:white;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

.name {
  font-weight:bold;
  margin-bottom:6px;
}

.btns {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn {
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  font-size:12px;
}

.edit {background:#e3f2fd;}
.delete {background:#fdecea;}

.modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.modal-btns .btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  font-weight: bold;
}

.save {
  background: #006241;
  color: white;
}

.cancel {
  background: #eee;
  color: #333;
}

/* 추가 버튼 */
.add-btn {
  position:fixed;
  bottom:20px;
  right:calc(50% - 200px);
  transform:translateX(50%);
  background:#006241;
  color:white;
  border:none;
  border-radius:50%;
  width:56px;
  height:56px;
  font-size:24px;
}

/* 모바일에서는 오른쪽 */
@media (max-width:480px){
  .add-btn {
    right:16px;
    transform:none;
  }
}

/* 모달 */
.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content {
  background:white;
  padding:16px;
  border-radius:12px;
  width:90%;
  max-width:380px;
}

input, select {
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="app">

<header>내부 품질 기한</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('core', this)">코어</div>
  <div class="tab" onclick="switchTab('promo', this)">프로모션</div>
</div>

<div class="search">
  <input type="text" placeholder="검색" onkeyup="searchItem(this.value)">
</div>

<div class="container" id="list"></div>

</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- 모달 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>원부재료</h3>

    <select id="type">
      <option value="core">코어</option>
      <option value="promo">프로모션</option>
    </select>

    <input id="name" placeholder="이름">
    <input id="storage" placeholder="보관 방법">
    <input id="pack" placeholder="원팩 기한">
    <input id="after" placeholder="소분 후 기한">

    <div class="modal-btns">
      <button class="btn cancel" onclick="closeModal()">취소</button>
      <button class="btn save" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'core';
let editId = null;

function getData(){
  return JSON.parse(localStorage.getItem('items') || '[]');
}

function setData(data){
  localStorage.setItem('items', JSON.stringify(data));
}

/* 렌더 */
function render(){
  const data = getData();
  const list = document.getElementById('list');
  list.innerHTML = '';

  data
    .filter(item => item.type === currentTab)
    .forEach(item => {

      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <div class="name">${item.name}</div>
        <div>보관: ${item.storage}</div>
        <div>원팩: ${item.pack}</div>
        <div>소분 후: ${item.after}</div>

        <div class="btns">
          <button class="btn edit" onclick="editItem('${item.id}')">수정</button>
          <button class="btn delete" onclick="deleteItem('${item.id}')">삭제</button>
        </div>
      `;

      list.appendChild(div);
    });
}

/* 탭 */
function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

/* 검색 */
function searchItem(text){
  const data = getData();

  const filtered = data.filter(item =>
    item.type === currentTab &&
    item.name.toLowerCase().includes(text.toLowerCase())
  );

  const list = document.getElementById('list');
  list.innerHTML = '';

  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <div class="name">${item.name}</div>
      <div>보관: ${item.storage}</div>
      <div>원팩: ${item.pack}</div>
      <div>소분 후: ${item.after}</div>

      <div class="btns">
        <button class="btn edit" onclick="editItem('${item.id}')">수정</button>
        <button class="btn delete" onclick="deleteItem('${item.id}')">삭제</button>
      </div>
    `;

    list.appendChild(div);
  });
}

/* 모달 */
function openModal(){
  editId = null;
  document.getElementById('type').value = currentTab;
  document.getElementById('name').value = '';
  document.getElementById('storage').value = '';
  document.getElementById('pack').value = '';
  document.getElementById('after').value = '';
  document.getElementById('modal').style.display='flex';
}

/* 저장 */
function saveItem(){
  console.log('저장 버튼 클릭됨');
  
  let data = getData();

  const item = {
    id: editId || Date.now().toString(),
    type: document.getElementById('type').value,
    name: document.getElementById('name').value,
    storage: document.getElementById('storage').value,
    pack: document.getElementById('pack').value,
    after: document.getElementById('after').value
  };

  console.log('저장 데이터:', item);

  if(!item.name){
    alert("이름 필수!");
    return;
  }

  if(editId){
    data = data.map(d => d.id === editId ? item : d);
  }else{
    data.push(item);
  }

  console.log('최종 데이터:', data);
  setData(data);
  closeModal();
  render();
}

/* 수정 */
function editItem(id){
  const data = getData();
  const item = data.find(d => d.id === id);

  document.getElementById('type').value = item.type;
  document.getElementById('name').value = item.name;
  document.getElementById('storage').value = item.storage;
  document.getElementById('pack').value = item.pack;
  document.getElementById('after').value = item.after;

  editId = id;
  document.getElementById('modal').style.display='flex';
}

/* 삭제 */
function deleteItem(id){
  if(!confirm("삭제할까?")) return;

  const data = getData().filter(d => d.id !== id);
  setData(data);
  render();
}

/* 닫기 */
function closeModal(){
  document.getElementById('modal').style.display='none';

  document.getElementById('name').value='';
  document.getElementById('storage').value='';
  document.getElementById('pack').value='';
  document.getElementById('after').value='';
}

/* 모달 배경 클릭 시 닫기 */
document.addEventListener('DOMContentLoaded', function(){
  const modal = document.getElementById('modal');
  modal.addEventListener('click', function(e){
    if(e.target === modal){
      closeModal();
    }
  });
});

render();
</script>

</body>
</html>
