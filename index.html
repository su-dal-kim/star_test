<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내부 품질 기한</title>

<style>
body {margin:0;font-family:sans-serif;background:#f4f6f8;}
header {background:#006241;color:white;padding:14px;text-align:center;font-weight:bold;}

/* 탭 */
.tabs {
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}
.tab {
  flex:1;
  text-align:center;
  padding:10px;
  font-size:14px;
  color:#777;
}
.tab.active {
  color:#006241;
  font-weight:bold;
  border-bottom:2px solid #006241;
}

/* 검색 */
.search {padding:10px;background:white;}
.search input {
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* 카드 */
.container {padding:10px;}
.card {
  background:white;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

.name {font-weight:bold;margin-bottom:6px;}

.btns {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn {
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  font-size:12px;
}

.edit {background:#e3f2fd;}
.delete {background:#fdecea;}

/* 추가 버튼 */
.add-btn {
  position:fixed;
  bottom:16px;
  right:16px;
  background:#006241;
  color:white;
  border:none;
  border-radius:50%;
  width:56px;
  height:56px;
  font-size:24px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* 모달 */
.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  justify-content:center;
  align-items:center;
}

/* 💡 핵심: 반응형 */
.modal-content {
  background:white;
  padding:16px;
  border-radius:12px;
  width:90%;
  max-width:400px;
  max-height:80vh;
  overflow-y:auto;
}

@media (max-width:600px){
  .modal-content {
    max-height:90vh;
  }
}

input, select {
  width:100%;
  padding:8px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<header>내부 품질 기한</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('core', this)">코어</div>
  <div class="tab" onclick="switchTab('promo', this)">프로모션</div>
</div>

<div class="search">
  <input type="text" placeholder="검색 (예: 휘핑)" onkeyup="searchItem(this.value)">
</div>

<div class="container" id="list"></div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- 모달 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>원부재료</h3>

    <select id="type">
      <option value="core">코어</option>
      <option value="promo">프로모션</option>
    </select>

    <input id="name" placeholder="이름">
    <input id="storage" placeholder="보관 방법">
    <input id="pack" placeholder="원팩 기한">
    <input id="after" placeholder="소분 후 기한">

    <button onclick="saveItem()">저장</button>
  </div>
</div>

<script>
let currentTab = 'core';
let editId = null;

/* 데이터 불러오기 */
function getData(){
  return JSON.parse(localStorage.getItem('items') || '[]');
}

/* 저장 */
function setData(data){
  localStorage.setItem('items', JSON.stringify(data));
}

/* 렌더 */
function render(data){
  const list = document.getElementById('list');
  list.innerHTML = '';

  data
    .filter(item => item.type === currentTab)
    .forEach(item => {

      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <div class="name">${item.name}</div>
        <div>보관: ${item.storage}</div>
        <div>원팩: ${item.pack}</div>
        <div>소분 후: ${item.after}</div>

        <div class="btns">
          <button class="btn edit" onclick="editItem('${item.id}')">수정</button>
          <button class="btn delete" onclick="deleteItem('${item.id}')">삭제</button>
        </div>
      `;

      list.appendChild(div);
    });
}

/* 탭 */
function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  load();
}

/* 검색 */
function searchItem(text){
  const data = getData();

  const filtered = data.filter(item =>
    item.type === currentTab &&
    item.name.toLowerCase().includes(text.toLowerCase())
  );

  render(filtered);
}

/* 모달 열기 */
function openModal(){
  editId = null;
  document.getElementById('modal').style.display='flex';
}

/* 저장 */
function saveItem(){
  let data = getData();

  const item = {
    id: editId || Date.now().toString(),
    type: document.getElementById('type').value,
    name: document.getElementById('name').value,
    storage: document.getElementById('storage').value,
    pack: document.getElementById('pack').value,
    after: document.getElementById('after').value
  };

  if(!item.name){
    alert("이름 필수!");
    return;
  }

  if(editId){
    data = data.map(d => d.id === editId ? item : d);
  }else{
    data.push(item);
  }

  setData(data);
  closeModal();
  load();
}

/* 수정 */
function editItem(id){
  const data = getData();
  const item = data.find(d => d.id === id);

  document.getElementById('type').value = item.type;
  document.getElementById('name').value = item.name;
  document.getElementById('storage').value = item.storage;
  document.getElementById('pack').value = item.pack;
  document.getElementById('after').value = item.after;

  editId = id;
  document.getElementById('modal').style.display='flex';
}

/* 삭제 */
function deleteItem(id){
  if(!confirm("삭제할까?")) return;

  const data = getData().filter(d => d.id !== id);
  setData(data);
  load();
}

/* 닫기 */
function closeModal(){
  document.getElementById('modal').style.display='none';

  document.getElementById('name').value='';
  document.getElementById('storage').value='';
  document.getElementById('pack').value='';
  document.getElementById('after').value='';
}

/* 초기 */
function load(){
  render(getData());
}

load();
</script>

</body>
</html>
