<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내부 품질 기한 관리</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
}

header {
  background:#006241;
  color:white;
  padding:16px;
  text-align:center;
  font-weight:bold;
}

.container {
  padding:16px;
}

.card {
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.name {
  font-weight:bold;
  margin-bottom:6px;
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#006241;
  color:white;
  font-size:16px;
  margin-top:12px;
}

/* 모달 */
.modal {
  display:none;
  position:fixed;
  left:0; top:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.4);
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
}

input {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<header>내부 품질 기한 관리</header>

<div class="container" id="list"></div>

<div class="container">
  <button onclick="openModal()">+ 원부재료 추가하기</button>
</div>

<!-- 입력창 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>원부재료 추가</h3>
    <input id="name" placeholder="원부재료 이름">
    <input id="storage" placeholder="보관 방법">
    <input id="pack" placeholder="원팩 기한">
    <input id="after" placeholder="소분 후 기한">
    <button onclick="addItem()">저장</button>
  </div>
</div>

<script>

const listEl = document.getElementById('list');

/* 불러오기 */
function load() {
  const data = JSON.parse(localStorage.getItem('items') || '[]');
  listEl.innerHTML = '';

  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="name">${item.name}</div>
      <div>보관: ${item.storage}</div>
      <div>원팩: ${item.pack}</div>
      <div>소분 후: ${item.after}</div>
    `;
    listEl.appendChild(div);
  });
}

/* 모달 열기 */
function openModal() {
  document.getElementById('modal').style.display = 'flex';
}

/* 추가 */
function addItem() {
  const item = {
    name: document.getElementById('name').value,
    storage: document.getElementById('storage').value,
    pack: document.getElementById('pack').value,
    after: document.getElementById('after').value
  };

  if (!item.name) {
    alert("이름은 필수야!");
    return;
  }

  const data = JSON.parse(localStorage.getItem('items') || '[]');
  data.push(item);
  localStorage.setItem('items', JSON.stringify(data));

  document.getElementById('modal').style.display = 'none';

  // 입력값 초기화
  document.getElementById('name').value = '';
  document.getElementById('storage').value = '';
  document.getElementById('pack').value = '';
  document.getElementById('after').value = '';

  load();
}

/* 최초 실행 */
load();

</script>

</body>
</html>
