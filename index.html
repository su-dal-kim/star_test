<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내부 품질 기한</title>

<style>
body {margin:0;font-family:sans-serif;background:#f4f6f8;}
header {background:#006241;color:white;padding:16px;text-align:center;font-weight:bold;}

.tabs {display:flex;background:white;}
.tab {flex:1;text-align:center;padding:12px;font-weight:bold;color:#777;border-bottom:2px solid #eee;}
.tab.active {color:#006241;border-bottom:3px solid #006241;}

.search {padding:12px;background:white;}
.search input {width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;}

.container {padding:12px;}

.card {
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.name {font-weight:bold;margin-bottom:6px;}

.btns {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn {
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  font-size:13px;
  background:#e3f2fd;
}

.edit {background:#e3f2fd;}
.delete {background:#fdecea;}

.add-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#006241;
  color:white;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  font-size:26px;
}

.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:30%;
}

input, select {
  width:60%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<header>내부 품질 기한</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('core')">코어</div>
  <div class="tab" onclick="switchTab('promo')">프로모션</div>
</div>

<div class="search">
  <input type="text" placeholder="검색 (예: 휘핑)" onkeyup="searchItem(this.value)">
</div>

<div class="container" id="list"></div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- 모달 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>원부재료</h3>

    <select id="type">
      <option value="core">코어</option>
      <option value="promo">프로모션</option>
    </select>

    <input id="name" placeholder="이름">
    <input id="storage" placeholder="보관 방법">
    <input id="pack" placeholder="원팩 기한">
    <input id="after" placeholder="소분 후 기한">

    <button class="btn" onclick="saveItem()">저장</button>
  </div>
</div>

<script>
let currentTab = 'core';
let editIndex = null;

/* 로드 */
function load() {
  const data = JSON.parse(localStorage.getItem('items') || '[]');
  render(data);
}

/* 렌더 */
function render(data) {
  const list = document.getElementById('list');
  list.innerHTML = '';

  data
    .filter(item => item.type === currentTab)
    .forEach((item, index) => {

      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <div class="name">${item.name}</div>
        <div>보관: ${item.storage}</div>
        <div>원팩: ${item.pack}</div>
        <div>소분 후: ${item.after}</div>

        <div class="btns">
          <button class="btn edit" onclick="editItem(${index})">수정</button>
          <button class="btn delete" onclick="deleteItem(${index})">삭제</button>
        </div>
      `;

      list.appendChild(div);
    });
}

/* 탭 */
function switchTab(tab) {
  currentTab = tab;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  load();
}

/* 검색 */
function searchItem(text) {
  const data = JSON.parse(localStorage.getItem('items') || '[]');

  const filtered = data.filter(item =>
    item.type === currentTab &&
    item.name.toLowerCase().includes(text.toLowerCase())
  );

  render(filtered);
}

/* 추가 모달 */
function openModal() {
  editIndex = null;
  document.getElementById('modal').style.display = 'flex';
}

/* 저장 */
function saveItem() {
  const data = JSON.parse(localStorage.getItem('items') || '[]');

  const item = {
    type: document.getElementById('type').value,
    name: document.getElementById('name').value,
    storage: document.getElementById('storage').value,
    pack: document.getElementById('pack').value,
    after: document.getElementById('after').value
  };

  if (!item.name) {
    alert("이름은 필수입니다!");
    return;
  }

  if (editIndex !== null) {
    data[editIndex] = item;
  } else {
    data.push(item);
  }

  localStorage.setItem('items', JSON.stringify(data));
  closeModal();
  load();
}

/* 수정 */
function editItem(index) {
  const data = JSON.parse(localStorage.getItem('items') || '[]');
  const item = data[index];

  document.getElementById('type').value = item.type;
  document.getElementById('name').value = item.name;
  document.getElementById('storage').value = item.storage;
  document.getElementById('pack').value = item.pack;
  document.getElementById('after').value = item.after;

  editIndex = index;
  document.getElementById('modal').style.display = 'flex';
}

/* 삭제 */
function deleteItem(index) {
  if (!confirm("삭제할까요?")) return;

  const data = JSON.parse(localStorage.getItem('items') || '[]');
  data.splice(index, 1);
  localStorage.setItem('items', JSON.stringify(data));
  load();
}

/* 닫기 */
function closeModal() {
  document.getElementById('modal').style.display = 'none';

  document.getElementById('name').value = '';
  document.getElementById('storage').value = '';
  document.getElementById('pack').value = '';
  document.getElementById('after').value = '';
}

load();
</script>

</body>
</html>
