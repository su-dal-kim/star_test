<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내부 품질 기한</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin:0;
  font-family:sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
}

.app {
  width:100%;
  max-width:480px;
  background:#f4f6f8;
  min-height:100vh;
}

header {
  background:#006241;
  color:white;
  padding:14px;
  text-align:center;
  font-weight:bold;
}

.tabs {
  display:flex;
  background:white;
}
.tab {
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
  color:#777;
  cursor: pointer;
}
.tab.active {
  color:#006241;
  font-weight:bold;
  border-bottom:2px solid #006241;
}

.search {
  padding:10px;
  background:white;
}
.search input {
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

.container {
  padding:10px;
}

.card {
  background:white;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

.name {
  font-weight:bold;
  margin-bottom:6px;
  font-size: 16px;
}

.info-row {
  font-size: 14px;
  color: #555;
  margin-bottom: 2px;
}

.btns {
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn {
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  font-size:12px;
  cursor: pointer;
}

.edit {background:#e3f2fd;}
.delete {background:#fdecea;}

.add-btn {
  position:fixed;
  bottom:20px;
  right:calc(50% - 200px);
  transform:translateX(50%);
  background:#006241;
  color:white;
  border:none;
  border-radius:50%;
  width:56px;
  height:56px;
  font-size:24px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

@media (max-width:480px){
  .add-btn {
    right:16px;
    transform:none;
  }
}

.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content {
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:380px;
}

.modal-content h3 {
  margin-top: 0;
  margin-bottom: 15px;
}

.input-group {
  margin-bottom: 10px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-bottom: 4px;
}

input, select {
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
  font-size: 14px;
}

.modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-btns .btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
}

.save {
  background: #006241;
  color: white;
}

.cancel {
  background: #eee;
  color: #333;
}

/* 분류에 따른 필드 숨김 처리 */
.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="app">
  <header>내부 품질 기한</header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('core', this)">원부재료</div>
    <div class="tab" onclick="switchTab('promo', this)">부재료</div>
  </div>

  <div class="search">
    <input type="text" id="searchInput" placeholder="검색" onkeyup="searchItem(this.value)">
  </div>

  <div class="container" id="list"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- 모달 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">항목 추가</h3>

    <div class="input-group">
      <label>분류</label>
      <select id="type" onchange="toggleFields()">
        <option value="core">원부재료</option>
        <option value="promo">부재료</option>
      </select>
    </div>

    <div class="input-group">
      <label>이름</label>
      <input id="name" placeholder="이름을 입력하세요">
    </div>

    <!-- 원부재료 전용 필드 -->
    <div id="coreFields">
      <div class="input-group">
        <label>원팩 기한</label>
        <input id="pack" placeholder="원팩 기한">
      </div>
      <div class="input-group">
        <label>소분 후 기한</label>
        <input id="after" placeholder="소분 후 기한">
      </div>
    </div>

    <!-- 부재료 전용 필드 (내품기) -->
    <div id="promoFields" class="hidden">
      <div class="input-group">
        <label>내부 품질 기한 (내품기)</label>
        <input id="quality_limit" placeholder="내품기를 입력하세요">
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn cancel" onclick="closeModal()">취소</button>
      <button class="btn save" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'core';
let editId = null;

function getData(){
  return JSON.parse(localStorage.getItem('items') || '[]');
}

function setData(data){
  localStorage.setItem('items', JSON.stringify(data));
}

/* 분류에 따라 입력 필드 토글 */
function toggleFields() {
  const type = document.getElementById('type').value;
  const coreFields = document.getElementById('coreFields');
  const promoFields = document.getElementById('promoFields');
  
  if (type === 'core') {
    coreFields.classList.remove('hidden');
    promoFields.classList.add('hidden');
  } else {
    coreFields.classList.add('hidden');
    promoFields.classList.remove('hidden');
  }
}

/* 렌더 */
function render(filterText = ''){
  const data = getData();
  const list = document.getElementById('list');
  list.innerHTML = '';

  const filtered = data.filter(item => {
    const matchesTab = item.type === currentTab;
    const matchesSearch = item.name.toLowerCase().includes(filterText.toLowerCase());
    return matchesTab && matchesSearch;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">데이터가 없습니다.</div>';
    return;
  }

  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';

    let contentHtml = `<div class="name">${item.name}</div>`;
    
    if (item.type === 'core') {
      contentHtml += `
        <div class="info-row">원팩: ${item.pack || '-'}</div>
        <div class="info-row">소분 후: ${item.after || '-'}</div>
      `;
    } else {
      contentHtml += `
        <div class="info-row">내품기: ${item.quality_limit || '-'}</div>
      `;
    }

    contentHtml += `
      <div class="btns">
        <button class="btn edit" onclick="editItem('${item.id}')">수정</button>
        <button class="btn delete" onclick="deleteItem('${item.id}')">삭제</button>
      </div>
    `;

    div.innerHTML = contentHtml;
    list.appendChild(div);
  });
}

/* 탭 전환 */
function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('searchInput').value = '';
  render();
}

/* 검색 */
function searchItem(text){
  render(text);
}

/* 모달 열기 */
function openModal(){
  editId = null;
  document.getElementById('modalTitle').innerText = '항목 추가';
  document.getElementById('type').value = currentTab;
  
  // 필드 초기화
  document.getElementById('name').value = '';
  document.getElementById('pack').value = '';
  document.getElementById('after').value = '';
  document.getElementById('quality_limit').value = '';
  
  toggleFields();
  document.getElementById('modal').style.display='flex';
}

/* 저장 */
function saveItem(){
  let data = getData();
  const type = document.getElementById('type').value;
  const name = document.getElementById('name').value;

  if(!name){
    alert("이름을 입력해주세요!");
    return;
  }

  const item = {
    id: editId || Date.now().toString(),
    type: type,
    name: name,
    pack: document.getElementById('pack').value,
    after: document.getElementById('after').value,
    quality_limit: document.getElementById('quality_limit').value
  };

  if(editId){
    data = data.map(d => d.id === editId ? item : d);
  }else{
    data.push(item);
  }

  setData(data);
  closeModal();
  render();
}

/* 수정 */
function editItem(id){
  const data = getData();
  const item = data.find(d => d.id === id);
  if(!item) return;

  editId = id;
  document.getElementById('modalTitle').innerText = '항목 수정';
  document.getElementById('type').value = item.type;
  document.getElementById('name').value = item.name;
  document.getElementById('pack').value = item.pack || '';
  document.getElementById('after').value = item.after || '';
  document.getElementById('quality_limit').value = item.quality_limit || '';

  toggleFields();
  document.getElementById('modal').style.display='flex';
}

/* 삭제 */
function deleteItem(id){
  if(!confirm("정말 삭제하시겠습니까?")) return;
  const data = getData().filter(d => d.id !== id);
  setData(data);
  render();
}

/* 닫기 */
function closeModal(){
  document.getElementById('modal').style.display='none';
}

/* 모달 배경 클릭 시 닫기 */
window.onclick = function(event) {
  const modal = document.getElementById('modal');
  if (event.target == modal) {
    closeModal();
  }
}

// 초기 렌더링
render();
</script>

</body>
</html>
